<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>노가정 예약 관리</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/booking.css"><script src="/admin.js" defer></script></head><body><header><a class="brand" href="/">노가정</a><strong>예약 관리</strong><button id="logout" hidden>로그아웃</button></header><main class="section admin-main"><form id="login-form"><h1>예약 관리</h1><p>관리자 비밀번호로 로그인해 주세요.</p><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="button gold">로그인</button></form><p id="admin-status" role="status"></p><section id="dashboard" hidden><div class="section-heading"><h1>예약 현황</h1><button id="refresh" class="button gold">새로고침</button></div><p>자동 문자 알림은 없습니다. 새 예약을 확인하고 좌석과 이용 시간을 조율한 뒤 확정해 주세요.</p><div class="admin-controls"><label>날짜<input type="date" id="filter-date"></label><label>상태<select id="filter-status"><option value="active">진행 중</option><option value="all">전체</option><option value="pending">확인 대기</option><option value="confirmed">확정</option><option value="cancelled">취소</option><option value="completed">이용 완료</option></select></label></div><p id="summary"></p><div id="admin-list"></div><details><summary>날짜별 온라인 예약 마감 설정</summary><p>선택한 날짜의 새 온라인 신청을 막습니다. 이미 받은 예약은 자동 취소되지 않습니다.</p><form id="block-form"><label>마감할 날짜<input type="date" name="date" required></label><button class="button gold">해당 날짜 예약 마감</button></form><div id="blocked-dates"></div></details><p class="small-note">예약 정보는 방문일로부터 30일 경과 후 자동 정리됩니다. 확정 안내가 필요한 경우 전화 또는 문자 버튼으로 직접 연락해 주세요.</p></section></main></body></html>
